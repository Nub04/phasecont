[package]
name = "pckern-spike"
description = "Phase 0 spikes S1 to S4: FFI round trip, Cranelift JIT, collocation linear algebra, NVRTC"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "pckern"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "spikecli"
path = "src/bin/spikecli.rs"

[dependencies]
cranelift-codegen = "0.137.0"
cranelift-frontend = "0.137.0"
cranelift-jit = "0.137.0"
cranelift-module = "0.137.0"
cranelift-native = "0.137.0"
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-13000"] }
faer = { version = "0.24.4", default-features = false, features = ["std", "rayon", "sparse-linalg"] }
rayon = "1.11.0"
