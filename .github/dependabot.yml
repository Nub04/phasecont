# Weekly update pull requests. Each one runs the full CI, including
# `cargo deny check`, so a dependency with a license outside the allowed list
# fails before it can merge.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: [minor, patch]
    # @types/node follows the Node version inside VS Code (24 for VS Code
    # 1.146), not the newest Node. Raise its major with engines.vscode.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
