# Monthly update pull requests, grouped so each ecosystem opens at most one
# pull request for its minor and patch updates (and one for all GitHub Actions
# updates). A major update of a cargo or npm package still gets its own pull
# request. Each one runs the full CI, including `cargo deny check`, so a
# dependency with a license outside the allowed list fails before it can merge.
# Security updates are separate and arrive when an advisory is published.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: [minor, patch]
    # @types/node follows the Node version inside VS Code (24 for VS Code
    # 1.146), not the newest Node. Raise its major with engines.vscode.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
