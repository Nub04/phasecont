# Checks for every push and pull request. macos-jit.yml stays as the separate
# hardened-runtime probe, and release.yml builds the release package.
#
# Every job runs on a GitHub-hosted runner, so a pull request from a fork never
# runs on a machine of ours. Every third-party action is pinned by commit SHA,
# and no checkout keeps the token in .git/config.
name: ci

on:
  push:
    branches: [main, "phase*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: rustc -vV
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-fail-fast
      - name: Install cargo-deny
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-deny
      - name: Check licenses and advisories
        if: matrix.os == 'ubuntu-latest'
        run: cargo deny check

  # The VS Code extension and the pc-lsp server it starts. This job stages the
  # extension folder with the linux-x64 server. It builds no .vsix, because
  # the packaging tool is not approved yet (docs/STATUS.md, open decisions).
  vscode:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build pc-lsp
        run: cargo build --release -p pc-lsp
      - name: Place the server and check that it starts
        run: |
          set -eu
          mkdir -p editors/vscode/server/linux-x64
          cp target/release/pc-lsp editors/vscode/server/linux-x64/pc-lsp
          editors/vscode/server/linux-x64/pc-lsp --version
      - name: Install the npm packages without running install scripts
        working-directory: editors/vscode
        run: npm ci --ignore-scripts
      - name: Typecheck and run the tests
        working-directory: editors/vscode
        run: npm test
      - name: Bundle the extension
        working-directory: editors/vscode
        run: npm run bundle
      - name: Stage the extension folder
        run: |
          set -eu
          s=build/vscode-extension
          mkdir -p "$s"
          cd editors/vscode
          cp -r package.json README.md LICENSE THIRD_PARTY_LICENSES.txt \
            language-configuration.json syntaxes server "../../$s/"
          mkdir "../../$s/dist"
          cp dist/extension.js "../../$s/dist/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-extension-linux-x64
          path: build/vscode-extension
          if-no-files-found: error

  pckern-win:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: x86_64-pc-windows-gnu
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Cross build pckern.dll
        run: |
          # Replace the checkout and cargo home paths, so the DLL holds no
          # path of the runner. The flags apply to the Windows target only.
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/src --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          cargo build --release --locked --target x86_64-pc-windows-gnu -p pc-ffi
      - name: Build pc-cli for the host
        run: cargo build --release --locked -p pc-cli
      - name: Check the DLL imports and host paths
        run: |
          target/release/pc-cli dll-imports target/x86_64-pc-windows-gnu/release/pckern.dll
          scripts/check-host-paths target/x86_64-pc-windows-gnu/release/pckern.dll
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pckern-win64
          path: target/x86_64-pc-windows-gnu/release/pckern.dll
          if-no-files-found: error
      - name: Collect the third-party license texts of the three platforms
        run: >-
          target/release/pc-cli licenses
          --target x86_64-pc-windows-gnu
          --target x86_64-unknown-linux-gnu
          --target aarch64-apple-darwin
          --package pc-ffi
          --out licenses/THIRD_PARTY_LICENSES.txt
          --overrides licenses/overrides
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: licenses/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error

  # Hosted runners have no GPU, and a self-hosted runner on a public repository
  # is unsafe, so there is none. The three jobs below run what a machine without
  # a GPU can run. PC_REQUIRE_GPU turns a skipped GPU test into a failure, so a
  # green job shows that the test ran.

  # The OpenCL host code on PoCL, which runs OpenCL kernels on the CPU. This
  # covers device listing, compiling, launching, reading back and the self-test.
  # clang checks the OpenCL C text and, through a shim, the Metal text.
  gpu-pocl:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PC_REQUIRE_GPU: opencl,clang-opencl,clang-msl
      PC_REQUIRE_FP64: opencl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - name: Install PoCL, clinfo and clang
        run: sudo apt-get update && sudo apt-get install -y pocl-opencl-icd clinfo clang
      - name: List the OpenCL devices
        run: clinfo -l
      - name: Run the OpenCL host path and the kernel text checks
        run: cargo test --locked --no-fail-fast -p pc-ensemble --test device_selftest --test dispatch --test opencl_compile --test msl_syntax
      - name: Run the command-line self-test on the PoCL device
        run: |
          set -eu
          for p in single double; do
            cargo run --locked -q -p pc-cli -- gpu selftest --backend opencl --precision "$p"
          done

  # NVRTC without a driver or a device: compile the CUDA kernel to PTX for the
  # oldest and the newest architecture. NVRTC is NVIDIA's binary and is not part
  # of PhaseCont. The job downloads it from NVIDIA's redistributable archive,
  # checks the SHA-256 and uses it for this run only.
  gpu-nvrtc:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PC_REQUIRE_GPU: nvrtc
      NVRTC_ARCHIVE: cuda_nvrtc-linux-x86_64-13.4.59-archive
      NVRTC_SHA256: fe5de48fa0eb8aaf3f72cb2a86f913c727bf684f9d59072d359285dde32de783
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - name: Download NVRTC
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o nvrtc.tar.xz "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvrtc/linux-x86_64/$NVRTC_ARCHIVE.tar.xz"
          echo "$NVRTC_SHA256  nvrtc.tar.xz" | sha256sum -c -
          mkdir cuda
          tar xJf nvrtc.tar.xz -C cuda --strip-components=1
          # The engine looks for NVRTC in $CUDA_PATH/lib64.
          mv cuda/lib cuda/lib64
          echo "CUDA_PATH=$RUNNER_TEMP/cuda" >> "$GITHUB_ENV"
      - name: Compile the CUDA kernel to PTX
        run: cargo test --locked --no-fail-fast -p pc-ensemble --test cuda_compile

  # The Metal and Apple OpenCL host code on a hosted Mac, which may show a
  # partial paravirtual GPU or none. Nothing here has run on a Mac yet, so the
  # job does not block a merge. It compiles the Metal text with Apple's `metal`
  # tool, then runs the self-test on every device it finds. PC_REQUIRE_GPU is
  # left unset here: a runner without a device reports SKIPPED and the job stays
  # green, and the log says which it was.
  gpu-macos:
    if: github.event_name != 'schedule'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - name: List the devices
        run: |
          system_profiler SPDisplaysDataType || true
          cargo run --locked -q -p pc-cli -- gpu list
      - name: Write the Metal kernels
        run: PC_DUMP_MSL="$RUNNER_TEMP/msl" cargo test --locked -p pc-ensemble --test msl_syntax
      - name: Compile the Metal kernels with Apple's metal tool
        run: |
          set -eu
          # Xcode 26 ships the Metal compiler as a separate component.
          xcodebuild -downloadComponent MetalToolchain || true
          for f in "$RUNNER_TEMP"/msl/*.metal; do
            echo "== $f"
            xcrun -sdk macosx metal -c "$f" -o /dev/null
          done
      - name: Run the self-test on the Metal and OpenCL devices
        run: cargo test --locked --no-fail-fast -p pc-ensemble --test device_selftest -- --include-ignored --nocapture
      - name: Run the command-line self-test on Metal
        run: cargo run --locked -q -p pc-cli -- gpu selftest --backend metal --precision single

  # MATLAB R2026b on each platform: build the library and the MEX gateway, run
  # the test suites, package the toolbox for that platform, then install the
  # package from a folder outside the checkout, run an example in a second
  # MATLAB and uninstall it in a third. Windows takes the DLL from pckern-win; Linux and
  # macOS build the library from source. setup-matlab licenses MATLAB for a
  # public repository without a secret.
  matlab:
    if: github.event_name != 'schedule'
    needs: pckern-win
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - name: Download the Windows DLL
        if: runner.os == 'Windows'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pckern-win64
          path: prebuilt
      - name: Download the license texts
        if: runner.os == 'Windows'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
          path: licenses-out
      - name: Point the cargo and package tasks at the downloads
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "PHASECONT_PREBUILT=$GITHUB_WORKSPACE\\prebuilt" >> "$GITHUB_ENV"
          echo "PHASECONT_LICENSES=$GITHUB_WORKSPACE\\licenses-out\\THIRD_PARTY_LICENSES.txt" >> "$GITHUB_ENV"
      - uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3.1.0
        with:
          release: R2026b
      - name: Run buildtool cargo mex test package
        uses: matlab-actions/run-build@cf54c2229a74d57eb4e6ba1bbebd45793d37797e # v3.4.0
        with:
          tasks: cargo mex test package
      - name: List the symbols that the AOT libraries export
        if: failure() && runner.os != 'Windows'
        shell: bash
        run: |
          find "$RUNNER_TEMP" /tmp "${TMPDIR:-/tmp}" -name 'pcaot_*.mex*' 2>/dev/null | sort -u |
            while read -r lib; do
              echo "== $lib"
              if [ "$RUNNER_OS" = macOS ]; then nm -gU "$lib"; else nm -D --defined-only "$lib"; fi
            done
      - name: Check the glibc versions the Linux binaries need
        if: runner.os == 'Linux'
        run: scripts/check-glibc toolbox/bin/glnxa64/pckern.mexa64
      - name: Find the package
        shell: bash
        run: echo "PHASECONT_MLTBX=$(ls "$GITHUB_WORKSPACE"/build/PhaseCont-*.mltbx)" >> "$GITHUB_ENV"
      # Each step runs in its own MATLAB, since only the MATLAB that the action
      # starts is licensed. The example runs in a MATLAB that did not install
      # the toolbox, so the uninstall can delete pckern on Windows.
      - name: Install the package from a folder outside the checkout
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        env:
          PHASECONT_INSTALL_STEP: install
        with:
          command: cd(getenv("RUNNER_TEMP")); run(fullfile(getenv("GITHUB_WORKSPACE"), "scripts", "cleanInstallCheck.m"))
      - name: Run the example from the installed package
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        env:
          PHASECONT_INSTALL_STEP: example
        with:
          command: cd(getenv("RUNNER_TEMP")); run(fullfile(getenv("GITHUB_WORKSPACE"), "scripts", "cleanInstallCheck.m"))
      - name: Uninstall the package
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        env:
          PHASECONT_INSTALL_STEP: remove
        with:
          command: cd(getenv("RUNNER_TEMP")); run(fullfile(getenv("GITHUB_WORKSPACE"), "scripts", "cleanInstallCheck.m"))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: matlab-${{ matrix.os }}-junit
          path: build/test-results/junit.xml
          if-no-files-found: warn

  asan:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: rust-src
          targets: x86_64-unknown-linux-gnu
      - name: Test pc-ffi under AddressSanitizer
        run: cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu -p pc-ffi
      - name: Build pc-cli under AddressSanitizer
        run: cargo +nightly build -Zbuild-std --target x86_64-unknown-linux-gnu -p pc-cli
      - name: Run pc-cli cont on the fold and Lorenz models
        run: |
          set -eu
          cli=target/x86_64-unknown-linux-gnu/debug/pc-cli
          t=crates/pc-engine/tests
          for m in fold lorenz; do
            "$cli" cont "$t/models/$m.ode" "$t/problems/$m.json" > "$m.out.json"
          done
