# Checks for every push and pull request. macos-jit.yml stays as the separate
# hardened-runtime probe, and release.yml builds the release package.
#
# Every job runs on a GitHub-hosted runner, so a pull request from a fork never
# runs on a machine of ours. Every third-party action is pinned by commit SHA,
# and no checkout keeps the token in .git/config.
name: ci

on:
  push:
    branches: [main, "phase*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: rustc -vV
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-fail-fast
      - name: Install cargo-deny
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-deny
      - name: Check licenses and advisories
        if: matrix.os == 'ubuntu-latest'
        run: cargo deny check

  pckern-win:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: x86_64-pc-windows-gnu
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Cross build pckern.dll
        run: |
          # Replace the checkout and cargo home paths, so the DLL holds no
          # path of the runner. The flags apply to the Windows target only.
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/src --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          cargo build --release --locked --target x86_64-pc-windows-gnu -p pc-ffi
      - name: Build pc-cli for the host
        run: cargo build --release --locked -p pc-cli
      - name: Check the DLL imports and host paths
        run: |
          target/release/pc-cli dll-imports target/x86_64-pc-windows-gnu/release/pckern.dll
          scripts/check-host-paths target/x86_64-pc-windows-gnu/release/pckern.dll
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pckern-win64
          path: target/x86_64-pc-windows-gnu/release/pckern.dll
          if-no-files-found: error
      - name: Collect the third-party license texts of the three platforms
        run: >-
          target/release/pc-cli licenses
          --target x86_64-pc-windows-gnu
          --target x86_64-unknown-linux-gnu
          --target aarch64-apple-darwin
          --package pc-ffi
          --out licenses/THIRD_PARTY_LICENSES.txt
          --overrides licenses/overrides
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: licenses/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error

  # MATLAB R2026b on each platform: build the library and the MEX gateway, run
  # the test suites, package the toolbox for that platform, then install the
  # package from a folder outside the checkout, run an example in a second
  # MATLAB and uninstall it in a third. Windows takes the DLL from pckern-win; Linux and
  # macOS build the library from source. setup-matlab licenses MATLAB for a
  # public repository without a secret.
  matlab:
    if: github.event_name != 'schedule'
    needs: pckern-win
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - name: Download the Windows DLL
        if: runner.os == 'Windows'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pckern-win64
          path: prebuilt
      - name: Download the license texts
        if: runner.os == 'Windows'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
          path: licenses-out
      - name: Point the cargo and package tasks at the downloads
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "PHASECONT_PREBUILT=$GITHUB_WORKSPACE\\prebuilt" >> "$GITHUB_ENV"
          echo "PHASECONT_LICENSES=$GITHUB_WORKSPACE\\licenses-out\\THIRD_PARTY_LICENSES.txt" >> "$GITHUB_ENV"
      - uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3.1.0
        with:
          release: R2026b
      - name: Run buildtool cargo mex test package
        uses: matlab-actions/run-build@cf54c2229a74d57eb4e6ba1bbebd45793d37797e # v3.4.0
        with:
          tasks: cargo mex test package
      - name: List the symbols that the AOT libraries export
        if: failure() && runner.os != 'Windows'
        shell: bash
        run: |
          find "$RUNNER_TEMP" /tmp "${TMPDIR:-/tmp}" -name 'pcaot_*.mex*' 2>/dev/null | sort -u |
            while read -r lib; do
              echo "== $lib"
              if [ "$RUNNER_OS" = macOS ]; then nm -gU "$lib"; else nm -D --defined-only "$lib"; fi
            done
      - name: Check the glibc versions the Linux binaries need
        if: runner.os == 'Linux'
        run: scripts/check-glibc toolbox/bin/glnxa64/pckern.mexa64
      - name: Find the package
        shell: bash
        run: echo "PHASECONT_MLTBX=$(ls "$GITHUB_WORKSPACE"/build/PhaseCont-*.mltbx)" >> "$GITHUB_ENV"
      # Each step runs in its own MATLAB, since only the MATLAB that the action
      # starts is licensed. The example runs in a MATLAB that did not install
      # the toolbox, so the uninstall can delete pckern on Windows.
      - name: Install the package from a folder outside the checkout
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        env:
          PHASECONT_INSTALL_STEP: install
        with:
          command: cd(getenv("RUNNER_TEMP")); run(fullfile(getenv("GITHUB_WORKSPACE"), "scripts", "cleanInstallCheck.m"))
      - name: Run the example from the installed package
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        env:
          PHASECONT_INSTALL_STEP: example
        with:
          command: cd(getenv("RUNNER_TEMP")); run(fullfile(getenv("GITHUB_WORKSPACE"), "scripts", "cleanInstallCheck.m"))
      - name: Uninstall the package
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        env:
          PHASECONT_INSTALL_STEP: remove
        with:
          command: cd(getenv("RUNNER_TEMP")); run(fullfile(getenv("GITHUB_WORKSPACE"), "scripts", "cleanInstallCheck.m"))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: matlab-${{ matrix.os }}-junit
          path: build/test-results/junit.xml
          if-no-files-found: warn

  asan:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: rust-src
          targets: x86_64-unknown-linux-gnu
      - name: Test pc-ffi under AddressSanitizer
        run: cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu -p pc-ffi
      - name: Build pc-cli under AddressSanitizer
        run: cargo +nightly build -Zbuild-std --target x86_64-unknown-linux-gnu -p pc-cli
      - name: Run pc-cli cont on the fold and Lorenz models
        run: |
          set -eu
          cli=target/x86_64-unknown-linux-gnu/debug/pc-cli
          t=crates/pc-engine/tests
          for m in fold lorenz; do
            "$cli" cont "$t/models/$m.ode" "$t/problems/$m.json" > "$m.out.json"
          done
