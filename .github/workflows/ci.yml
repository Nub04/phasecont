# Checks for every push and pull request. macos-jit.yml stays as the separate
# hardened-runtime probe.
name: ci

on:
  push:
    branches: [main, "phase*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - run: rustc -vV
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-fail-fast
      - name: Install cargo-deny
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check licenses and advisories
        if: matrix.os == 'ubuntu-latest'
        run: cargo deny check

  pckern-win:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Cross build pckern.dll
        run: cargo build --release --locked --target x86_64-pc-windows-gnu -p pc-ffi
      - name: Build pc-cli for the host
        run: cargo build --release --locked -p pc-cli
      - name: Check the DLL imports against the allow-list
        run: target/release/pc-cli dll-imports target/x86_64-pc-windows-gnu/release/pckern.dll
      - uses: actions/upload-artifact@v4
        with:
          name: pckern-win64
          path: target/x86_64-pc-windows-gnu/release/pckern.dll
          if-no-files-found: error
      - name: Collect the third-party license texts
        run: >-
          target/release/pc-cli licenses
          --target x86_64-pc-windows-gnu --package pc-ffi
          --out licenses/THIRD_PARTY_LICENSES.txt
          --overrides licenses/overrides
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: licenses/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error

  # Needs a self-hosted Windows runner with the labels self-hosted, windows and
  # matlab. On that machine: MATLAB R2026b with `matlab` on PATH, and Microsoft
  # Visual C++ set up for `mex -setup C`. No Rust or MinGW is needed, because the
  # job copies the pckern.dll built by pckern-win. There is no license secret.
  matlab-windows:
    if: >-
      github.event_name != 'schedule' &&
      (github.event.pull_request.head.repo.full_name == github.repository ||
      github.event_name != 'pull_request')
    needs: pckern-win
    runs-on: [self-hosted, windows, matlab]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pckern-win64
          path: prebuilt
      - name: Point the cargo task at the prebuilt DLL
        shell: cmd
        run: echo PHASECONT_PREBUILT=%GITHUB_WORKSPACE%\prebuilt>>"%GITHUB_ENV%"
      - name: Run buildtool cargo mex test
        shell: cmd
        run: matlab -batch "buildtool cargo mex test"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matlab-windows-junit
          path: build/test-results/junit.xml
          if-no-files-found: warn

  # Same runner as matlab-windows. Builds build/PhaseCont-<version>.mltbx from
  # the prebuilt DLL and the license texts, then installs it into MATLAB from a
  # folder outside the checkout, runs an example and uninstalls it. The runner
  # must not have PhaseCont installed already (the check stops if it does).
  package-win:
    if: >-
      github.event_name != 'schedule' &&
      (github.event.pull_request.head.repo.full_name == github.repository ||
      github.event_name != 'pull_request')
    needs: pckern-win
    runs-on: [self-hosted, windows, matlab]
    timeout-minutes: 30
    # One run at a time: installToolbox changes the shared MATLAB Add-Ons folder.
    concurrency:
      group: package-win-runner
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pckern-win64
          path: prebuilt
      - uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
          path: licenses-out
      - name: Point the package task at the prebuilt DLL and the licenses
        shell: cmd
        run: |
          echo PHASECONT_PREBUILT=%GITHUB_WORKSPACE%\prebuilt>>"%GITHUB_ENV%"
          echo PHASECONT_LICENSES=%GITHUB_WORKSPACE%\licenses-out\THIRD_PARTY_LICENSES.txt>>"%GITHUB_ENV%"
      - name: Run buildtool cargo mex test package
        shell: cmd
        run: matlab -batch "buildtool cargo mex test package"
      - name: Install the package and run the example from a clean folder
        shell: cmd
        run: |
          for %%f in ("%GITHUB_WORKSPACE%\build\PhaseCont-*.mltbx") do set PHASECONT_MLTBX=%%~ff
          set CHECK_SCRIPT=%GITHUB_WORKSPACE%\scripts\cleanInstallCheck.m
          cd /d "%RUNNER_TEMP%"
          matlab -batch "run(getenv('CHECK_SCRIPT'))" > "%GITHUB_WORKSPACE%\build\install.log" 2>&1
          set CHECK_STATUS=%ERRORLEVEL%
          type "%GITHUB_WORKSPACE%\build\install.log"
          exit /b %CHECK_STATUS%
      - uses: actions/upload-artifact@v4
        with:
          name: PhaseCont-mltbx
          path: build/PhaseCont-*.mltbx
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-win-install-log
          path: build/install.log
          if-no-files-found: warn

  asan:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-unknown-linux-gnu
      - name: Test pc-ffi under AddressSanitizer
        run: cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu -p pc-ffi
      - name: Build pc-cli under AddressSanitizer
        run: cargo +nightly build -Zbuild-std --target x86_64-unknown-linux-gnu -p pc-cli
      - name: Run pc-cli cont on the fold and Lorenz models
        run: |
          set -eu
          cli=target/x86_64-unknown-linux-gnu/debug/pc-cli
          t=crates/pc-engine/tests
          for m in fold lorenz; do
            "$cli" cont "$t/models/$m.ode" "$t/problems/$m.json" > "$m.out.json"
          done
