[package]
name = "pc-cli"
description = "Headless runner: parse models, run session JSON files, run benchmarks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
pc-codegen = { path = "../pc-codegen" }
pc-engine = { path = "../pc-engine" }
pc-ensemble = { path = "../pc-ensemble" }
pc-ffi = { path = "../pc-ffi" }
pc-ir = { path = "../pc-ir" }
pc-jit = { path = "../pc-jit" }
pc-latex = { path = "../pc-latex" }
pc-ode = { path = "../pc-ode" }
serde_json = "1.0.154"

# libtest runs tests on spawned threads, so this test checks the main thread from its
# own `main`.
[[test]]
name = "main_thread_x87"
harness = false
