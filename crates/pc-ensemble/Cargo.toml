[package]
name = "pc-ensemble"
description = "CPU and GPU ensemble integrators"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Test-only: one-shot fault hooks for the device tests (SPEC, kept contexts). Default and release
# builds leave it off.
[features]
fault-injection = []

[dependencies]
# Loaded at run time (dynamic-loading), never linked. cuda-13000 only picks the library names.
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-13000"] }
libloading = "0.9.0"
libm = "0.2.16"
# Loaded at run time (dynamic), never linked. Default features off, so no extension bindings.
opencl3 = { version = "0.12.4", default-features = false, features = ["dynamic"] }
pc-codegen = { path = "../pc-codegen" }
pc-ir = { path = "../pc-ir" }
pc-ode = { path = "../pc-ode" }
rayon = "1.11"

# Metal, on macOS only. Metal.framework is linked by objc2-metal; there is no other route.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSError", "NSObject", "NSProcessInfo", "NSString"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLAllocation", "MTLBuffer", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLComputeCommandEncoder", "MTLComputePipeline", "MTLDevice", "MTLLibrary", "MTLResource", "MTLTypes"] }

[dev-dependencies]
pc-engine = { path = "../pc-engine" }
