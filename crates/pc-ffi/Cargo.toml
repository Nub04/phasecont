[package]
name = "pc-ffi"
description = "C ABI for the MEX gateway: handle registry and panic barrier"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
# The MEX gateway loads this library as pckern.dll, libpckern.so or libpckern.dylib.
name = "pckern"
crate-type = ["cdylib", "rlib"]

[dependencies]
pc-codegen = { path = "../pc-codegen" }
pc-engine = { path = "../pc-engine" }
pc-ir = { path = "../pc-ir" }
pc-jit = { path = "../pc-jit" }
pc-linalg = { path = "../pc-linalg" }
pc-ode = { path = "../pc-ode" }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
