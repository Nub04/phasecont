# cargo-deny configuration. `cargo deny check` runs before every commit.

[graph]
# Check optional dependencies too, not only the default feature set.
all-features = true

[advisories]
ignore = [
    # paste 1.0.15 is unmaintained and has no fixed release. It is a build-time proc-macro that
    # faer 0.24.4 pulls in through gemm and pulp, so no paste code runs in pckern.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time proc-macro under faer; no upgrade" },
]

[licenses]
# CLAUDE.md rule 2. Ask before adding anything to this list.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
# The list is a policy, so licenses that no current dependency uses are fine.
unused-allowed-license = "allow"
confidence-threshold = 0.93
exceptions = []
# There is no [licenses.private] section, so the workspace crates are checked
# as well, and a crate without `license.workspace = true` fails the check.

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path, without a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
