[workspace]
resolver = "3"
members = ["crates/*"]
# The Phase 0 spikes are a separate workspace with their own lock file.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.97"

[profile.release]
# pc-ffi catches panics with catch_unwind before they reach the C ABI,
# which only works when panics unwind.
panic = "unwind"

# The continuation tests solve large bordered systems. Without optimization the linear
# algebra and the Newton loops make one cycle branch take tens of seconds.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.pc-linalg]
opt-level = 2

[profile.dev.package.pc-engine]
opt-level = 2
